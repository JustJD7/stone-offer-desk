name: Ingest AutoMail inventory

on:
  schedule:
    # Every 3 hours, UTC. GitHub disables scheduled workflows automatically
    # after 60 days with no repo activity — push a commit occasionally, or
    # re-enable it under the repo's Actions tab if that happens.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run ingest-automail
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SEARCH_QUERY: ${{ secrets.GMAIL_SEARCH_QUERY }}
