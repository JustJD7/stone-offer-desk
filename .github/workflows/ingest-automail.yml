name: Ingest AutoMail inventory

on:
  schedule:
    # Hourly, UTC. GitHub disables scheduled workflows automatically after 60
    # days with no repo activity — push a commit occasionally, or re-enable it
    # under the repo's Actions tab if that happens.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run ingest-automail
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
